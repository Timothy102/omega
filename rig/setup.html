<!doctype html>
<meta charset="utf-8"><title>rig setup</title>
<style>
:root{--bg:#fbfbfa;--fg:#1a1a19;--dim:#6b6b68;--line:#e4e4e1;--card:#fff;--soft:#f4f4f2;
 --ok:#1a7f4b;--err:#b3261e;--accent:#2b6cb0}
@media(prefers-color-scheme:dark){:root{--bg:#191918;--fg:#e8e8e5;--dim:#96968f;--line:#33332f;
 --card:#212120;--soft:#262625;--ok:#4ade80;--err:#f87171;--accent:#7cb3ea}}
*{box-sizing:border-box}
body{margin:0;padding:0;background:var(--bg);color:var(--fg);
 font:14px/1.55 ui-sans-serif,-apple-system,system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:48px 24px 80px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--dim);margin:0 0 26px}
.steps{display:flex;gap:6px;margin-bottom:34px}
.steps div{height:3px;flex:1;background:var(--line);border-radius:2px;transition:background .25s}
.steps div.done{background:var(--ok)}.steps div.now{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px}
label{display:block;font-size:12px;color:var(--dim);margin:14px 0 5px}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
 background:var(--bg);color:var(--fg);font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{padding:9px 16px;border:1px solid var(--line);border-radius:7px;background:var(--bg);
 color:var(--fg);font-size:13px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover:not(:disabled){opacity:.9;color:#fff}
button:disabled{opacity:.45;cursor:default}
.nav{display:flex;justify-content:space-between;margin-top:26px}
.ok{color:var(--ok)}.err{color:var(--err)}.dim{color:var(--dim)}
.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.msg{margin-top:12px;font-size:13px;min-height:20px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600}
tr.best td{background:var(--soft)}
.role{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin-bottom:9px}
.role .n{font-size:12px}.role .n b{display:block;font:12px ui-monospace,monospace}
pre{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:13px;
 overflow-x:auto;font:12px ui-monospace,monospace;margin:12px 0 0}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;
 background:var(--soft);border:1px solid var(--line);margin:2px 4px 2px 0}
h3.sec{margin:20px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.cathead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);
 margin:16px 0 4px;font-weight:600}
.introw{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.introw .meta{flex:1;min-width:0}
.introw .meta .b{font-size:12px;color:var(--dim);margin-top:1px}
#catSearch{margin:8px 0}
button.small{padding:5px 10px;font-size:12px}
</style>
<main>
<h1>rig</h1><p class="sub" id="tagline">Let's get you running.</p>
<div class="steps" id="steps"></div>
<div class="card" id="card"></div>
<div class="nav"><button id="back" onclick="go(-1)">Back</button>
<button id="next" class="primary" onclick="go(1)">Continue</button></div>
</main>
<script>
const T = new URLSearchParams(location.search).get("t");
// /api/* is POST-only: GET dispatch was a CSRF-reachable RCE.
const api=(p,b)=>fetch(p+"?t="+T,{method:"POST",headers:{"Content-Type":"application/json",
  "X-Rig-Token":T},body:JSON.stringify(b||{})}).then(r=>r.json());
const $=s=>document.querySelector(s);
let cfg=null, models=[], bench=[], step=0, keyOk=false, ranTest=false;

const ROLES={main:["Main","drives your session — pick the smartest"],
  plan:["Planning","read-only research and plans"],
  subagent_fast:["Fast subagent","bounded lookups — pick the quickest"],
  subagent_mid:["Mid subagent","reasoning across files"],
  compact:["Compaction","summarises old context"]};

const STEPS=[
{t:"Provider",r:()=>`<h2>Connect a provider</h2>
 <p class="dim">rig talks to Anthropic natively, or any OpenAI-compatible endpoint.</p>
 <label>Provider type</label>
 <select id="providerType" onchange="onProviderTypeChange()">
   <option value="openai"${Object.values(cfg.providers)[0].type!=='anthropic'?' selected':''}>OpenAI-compatible</option>
   <option value="anthropic"${Object.values(cfg.providers)[0].type==='anthropic'?' selected':''}>Anthropic (native)</option>
 </select>
 <div id="baseUrlRow" style="${Object.values(cfg.providers)[0].type==='anthropic'?'display:none':''}">
 <label>Base URL</label><input id="baseUrl" value="${Object.values(cfg.providers)[0].baseUrl||''}"></div>
 <label>API key ${Object.values(cfg.providers)[0].hasKey?'<span class="ok">· already stored</span>':''}</label>
 <input id="apiKey" type="password" placeholder="${Object.values(cfg.providers)[0].hasKey?'•••••••••••• (stored)':'sk-…'}">
 <div class="msg" id="m"></div>`,
 enter(){ if(Object.values(cfg.providers)[0].hasKey) verify(); },
 next:()=>keyOk||verify()},

{t:"Models",r:()=>`<h2>Pick your models</h2>
 <p class="dim">${models.length} available. Measure them, then assign roles.</p>
 <button onclick="runBench()" id="bb">Measure latency</button>
 <span class="mono dim" id="bs"></span>
 <div id="bt"></div><div id="rs" style="margin-top:20px"></div>`,
 enter(){ renderRoles(); }},

{t:"Tools",r:()=>`<h2>Connect tools</h2>
 <p class="dim">Connect from the catalog, import what Claude Code already has, or manage
 what rig is already using. Tools stay out of the prompt until the model searches for them.</p>
 <div id="mc" class="dim">loading…</div>`,
 enter(){ loadConnections(); }},

{t:"Test",r:()=>`<h2>Take it for a spin</h2>
 <p class="dim">Runs one real turn against your config — proof it works end to end.</p>
 <button onclick="drive()" id="db" class="primary">Run test</button>
 <div id="dr"></div>`},

{t:"Done",r:()=>`<h2>You're set</h2>
 <p class="dim">Config written to <span class="mono">~/.rig/config.json</span>.</p>
 <pre>rig                      # interactive
rig "fix the failing test"
rig --plan "add caching"  # read-only planning
rig --mcp "list my Linear issues"</pre>
 <p class="dim" style="margin-top:16px">Re-run this anytime with
 <span class="mono">rig setup</span>.</p>`}];

function render(){
  $("#steps").innerHTML = STEPS.map((_,i)=>
    `<div class="${i<step?'done':i===step?'now':''}"></div>`).join("");
  $("#card").innerHTML = STEPS[step].r();
  $("#back").style.visibility = step? "visible":"hidden";
  $("#next").textContent = step===STEPS.length-1? "Finish":"Continue";
  $("#tagline").textContent = STEPS[step].t;
  STEPS[step].enter?.();
}
async function go(d){
  if(d>0 && STEPS[step].next && !(await STEPS[step].next())) return;
  if(d>0 && step===STEPS.length-1){ await save(); $("#next").textContent="Saved"; return; }
  if(d>0) await save();
  step=Math.max(0,Math.min(STEPS.length-1,step+d)); render();
}
function onProviderTypeChange(){
  const p=Object.values(cfg.providers)[0], isAnthropic=$("#providerType").value==="anthropic";
  p.type=$("#providerType").value;
  $("#baseUrlRow").style.display = isAnthropic ? "none" : "";
}
async function verify(){
  const m=$("#m"); m.textContent="checking…"; m.className="msg dim";
  const p=Object.values(cfg.providers)[0];
  p.type=$("#providerType").value;
  const body={}; const k=$("#apiKey")?.value; if(k) body.apiKey=k;
  if(p.type!=='anthropic' && $("#baseUrl")) p.baseUrl=$("#baseUrl").value;
  if(k) p.apiKey=k;
  else delete p.apiKey;  // never write back a redacted key
  const r=await api("/api/models",body);
  if(r.error){ m.textContent="✗ "+r.error.slice(0,90); m.className="msg err"; return keyOk=false; }
  models=r.models; keyOk=true;
  m.innerHTML=`<span class="ok">✓ connected — ${models.length} models available</span>`;
  return true;
}
async function runBench(){
  const b=$("#bb"); b.disabled=true; $("#bs").textContent=" measuring one at a time…";
  const r=await api("/api/benchmark",{});
  bench=r.results||[]; b.disabled=false; $("#bs").textContent="";
  $("#bt").innerHTML=`<table><tr><th>Model</th><th>Round trip</th></tr>`+
    bench.map((x,i)=>`<tr class="${i===0&&x.ok?'best':''}"><td class="mono">${x.model}</td>
    <td class="${x.ok?'ok':'err'} mono">${x.ok?x.ms+"ms":x.error}</td></tr>`).join("")+`</table>`;
  renderRoles();
}
function renderRoles(){
  const fast=bench.filter(b=>b.ok)[0]?.model;
  $("#rs").innerHTML=Object.entries(ROLES).map(([k,[n,d]])=>`<div class="role">
    <span class="n">${n}<b>${k}</b></span>
    <select data-role="${k}">${(models.length?models:[cfg.roles[k].model])
      .map(m=>`<option${m===cfg.roles[k].model?" selected":""}>${m}</option>`).join("")}</select>
    </div><p class="dim" style="margin:-4px 0 12px;font-size:12px">${d}${
      fast&&k.includes("fast")?` — fastest measured: <b>${fast}</b>`:""}</p>`).join("");
}
let connData=null, catFilter="";

async function loadConnections(){
  connData=await api("/api/connections/list");
  renderConnections();
}
function connStateBadge(r){
  if(r.state==="connected") return `<span class="ok">connected</span> <span class="dim">(${r.tools})</span>`;
  if(r.state==="needs_auth") return `<span class="err">needs auth</span>`;
  if(r.state==="error") return `<span class="err">error</span>`;
  if(r.state==="disabled") return `<span class="dim">disabled</span>`;
  return `<span class="dim">configured</span>`;
}
function renderConnections(){
  let html="";
  if(connData.configured.length){
    html+=`<h3 class="sec">Connected</h3><table><tr><th>Name</th><th>State</th><th></th></tr>`+
      connData.configured.map(r=>`<tr><td>${r.name}</td><td>${connStateBadge(r)}</td>
        <td style="width:260px">
        <button class="small" onclick="connectServer('${r.name}')">connect</button>
        <button class="small" onclick="testServer('${r.name}')">test</button>
        <button class="small" onclick="toggleServer('${r.name}',${r.enabled?"false":"true"})">${r.enabled?"disable":"enable"}</button>
        <button class="small" onclick="removeServer('${r.name}')">remove</button>
        </td></tr>`).join("")+`</table>`;
  }
  if(connData.claudeCode.length){
    html+=`<h3 class="sec">Found in Claude Code</h3><table><tr><th>Name</th><th></th><th></th></tr>`+
      connData.claudeCode.map(c=>`<tr><td>${c.name}</td>
        <td class="mono dim">${c.transport==="stdio"?c.command:c.url}</td>
        <td style="width:100px"><button class="small" onclick="importClaude('${c.name}')">import</button></td>
        </tr>`).join("")+`</table>`;
  }
  html+=`<h3 class="sec">Catalog</h3>
    <input id="catSearch" placeholder="Search integrations…" value="${catFilter}"
     oninput="catFilter=this.value;renderCatalog()">
    <div id="catList"></div>
    <div class="msg" id="connMsg"></div>`;
  $("#mc").innerHTML=html;
  renderCatalog();
}
function renderCatalog(){
  const q=catFilter.trim().toLowerCase();
  const groups={};
  connData.catalog.forEach(i=>{
    if(q && !(i.name.toLowerCase().includes(q) || i.blurb.toLowerCase().includes(q) || i.key.includes(q))) return;
    (groups[i.category]=groups[i.category]||[]).push(i);
  });
  const cats=Object.keys(groups).sort();
  $("#catList").innerHTML=cats.length ? cats.map(cat=>`
    <div class="cathead">${cat}</div>
    ${groups[cat].map(i=>`<div class="introw">
       <div class="meta"><b>${i.name}</b>${i.verified?"":' <span class="dim">unverified</span>'}
       <div class="b">${i.blurb}</div></div>
       <span class="pill">${i.auth}</span>
       <button class="small" onclick="addFromCatalog('${i.key}')">connect</button>
     </div>`).join("")}`).join("")
    : `<p class="dim">no matches</p>`;
}
function connMsg(text,ok){
  const m=$("#connMsg"); if(!m) return;
  m.textContent=text; m.className="msg "+(ok?"ok":"err");
}
async function addFromCatalog(key){
  const entry=connData.catalog.find(i=>i.key===key);
  const env={};
  for(const k of (entry?.env||[])){
    const v=window.prompt(`${entry.name} needs ${k}:`);
    if(v===null) return;  // cancelled
    if(v) env[k]=v;
  }
  const r=await api("/api/connections/add",{name:key,key,env});
  if(r.error){ connMsg(`${key}: ${r.error}`,false); return; }
  await connectServer(key);
}
async function importClaude(name){
  const r=await api("/api/connections/add",{name,source:"claude-code"});
  if(r.error){ connMsg(`${name}: ${r.error}`,false); return; }
  connData=await api("/api/connections/list"); renderConnections();
}
async function connectServer(name){
  const st=await api("/api/connections/connect",{name});
  if(st.state==="needs_auth") connMsg(`${name}: open ${st.error} to authorise, then click connect again`,false);
  else if(st.state==="connected") connMsg(`${name}: connected (${st.tools} tools)`,true);
  else connMsg(`${name}: ${st.state}${st.error?" — "+st.error:""}`,false);
  connData=await api("/api/connections/list"); renderConnections();
}
async function testServer(name){
  const st=await api("/api/connections/test",{name});
  connMsg(`${name}: ${st.state==="connected"?`ok (${st.tools} tools)`:(st.error||st.state)}`,st.state==="connected");
  connData=await api("/api/connections/list"); renderConnections();
}
async function toggleServer(name,val){
  await api("/api/connections/toggle",{name,enabled:val});
  connData=await api("/api/connections/list"); renderConnections();
}
async function removeServer(name){
  await api("/api/connections/remove",{name});
  connData=await api("/api/connections/list"); renderConnections();
}
async function drive(){
  const b=$("#db"); b.disabled=true; b.textContent="running…";
  const r=await api("/api/agent",{prompt:"Run 'pwd' and 'date' with bash, then say in one short sentence where you are and what day it is."});
  b.disabled=false; b.textContent="Run again"; ranTest=r.ok;
  $("#dr").innerHTML=r.ok
    ?`<p style="margin-top:14px">${r.tools.map(t=>`<span class="pill">⏺ ${t}</span>`).join("")}</p>
      <pre>${r.text.replace(/[<>]/g,"")}</pre><p class="ok" style="margin-top:10px">✓ working</p>`
    :`<pre class="err">${(r.error||"failed").replace(/[<>]/g,"")}</pre>`;
}
async function save(){
  document.querySelectorAll("select[data-role]").forEach(s=>cfg.roles[s.dataset.role].model=s.value);
  await api("/api/save",cfg);
}
api("/api/config").then(c=>{cfg=c; render();});
</script>
