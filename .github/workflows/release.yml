# One-time setup required by the repo owner before this workflow can publish:
#
#   1. Sign in to https://pypi.org and create (or claim) the "omega-code" project.
#      If the project does not exist yet on PyPI, use PyPI's "pending publisher"
#      flow instead: https://pypi.org/manage/account/publishing/ and register a
#      pending trusted publisher for a project that does not exist yet.
#   2. On the project's "Publishing" settings page (Manage -> Publishing), add a
#      new trusted publisher with:
#        - Owner:            Timothy102
#        - Repository name:  omega
#        - Workflow name:    release.yml
#        - Environment name: pypi
#   3. No API token or secret is needed — PyPI trusts this workflow's OIDC
#      identity directly, scoped to the "pypi" GitHub Environment below.
#      (Optional but recommended: create a "pypi" environment under repo
#      Settings -> Environments and add required reviewers for extra safety.)
#
# Once that's done, pushing a tag matching `v*` (e.g. `v0.3.0`) builds the
# sdist/wheel, publishes them to PyPI, and creates a matching GitHub release.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          awk -v ver="$version" '
            BEGIN { found = 0 }
            /^## / {
              if (found) exit
              if ($0 ~ "^## \\[?" ver "\\]?") { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "Release ${GITHUB_REF_NAME}" > "$notes_file"
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: dist/*
