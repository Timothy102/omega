[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rig"
version = "0.2.0"
description = "A fast personal coding agent harness"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=2,<3",
    "mcp>=1.9,<2",
    "rich>=13,<15",
    "httpx>=0.27,<1", # used directly by setup_server; was only transitive
    "textual>=8.2.8",
    "anthropic>=1.2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
rig = "rig.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["rig"]
artifacts = ["rig/setup.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E401: stdlib imports are deliberately grouped on one line.
# E741: `S`/`I` are the tool-schema shorthands used throughout tools.py.
ignore = ["E401", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["rig"]
