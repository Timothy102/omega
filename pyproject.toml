[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rig"
version = "0.2.0"
description = "A fast personal coding agent harness"
requires-python = ">=3.11"
dependencies = [
    "openai>=2,<3",
    "mcp>=1.9,<2",
    "prompt_toolkit>=3,<4",
    "rich>=13,<15",
    "httpx>=0.27,<1",     # used directly by setup_server; was only transitive
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rig = "rig.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["rig"]
artifacts = ["rig/setup.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
