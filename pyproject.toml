[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omega-code"
version = "0.3.0"
description = "A fast personal coding agent harness"
readme = "README.md"
license = "MIT"
authors = [{name = "Tim Cvetko"}]
requires-python = ">=3.11"
keywords = ["coding-agent", "cli", "llm", "agent", "harness", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "openai>=2,<3",
    "mcp>=1.9,<2",
    "rich>=13,<15",
    "httpx>=0.27,<1", # used directly by setup_server; was only transitive
    "textual>=8.2.8",
    "anthropic>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/Timothy102/omega"
Repository = "https://github.com/Timothy102/omega"
Issues = "https://github.com/Timothy102/omega/issues"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260815",
]

[project.scripts]
omega = "omega.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["omega"]
artifacts = ["omega/setup.html", "omega/eval/examples/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E401: stdlib imports are deliberately grouped on one line.
# E741: `S`/`I` are the tool-schema shorthands used throughout tools.py.
ignore = ["E401", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["omega"]
